FontColor=#colorDim#
Y=4R
Text=Click a box to pick an adapter (right-click goes back). Changes apply to the gadget right away. If every slot is (none), the gadget shows the active interface.

[MeterRedetect]
Meter=String
MeterStyle=StyleString
FontColor=#colorAccent#
Y=6R
Text=Re-detect network adapters
LeftMouseUpAction=[!CommandMeasure MeasureAdapters "Run"]
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#colorAccent#,#hoverAlpha#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#colorAccent#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterBackgroundHeight]
