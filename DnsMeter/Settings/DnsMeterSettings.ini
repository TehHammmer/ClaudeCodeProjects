; ==================================================
;  DNS Meter Settings - pick up to four interfaces for the DNS Meter gadget
;  Opened from the gadget (click it, or right-click > DNS Meter settings).
; ==================================================

[Rainmeter]
AccurateText=1
OnRefreshAction=[!CommandMeasure MeasureAdapters "Run"]
Group=ModernGadgets | MgDnsMeter

[Metadata]
Name=DNS Meter Settings
Author=Darin (built on raiguard's ModernGadgets)
Information=Settings window for the DNS Meter gadget.
License=MIT (see LICENSE.md)
Version=1.3.0

[Variables]
@includeStyleSheet=#@#StyleSheet.inc
@includeGlobalSettings=#@#Settings\GlobalSettings.inc
@includeDnsSettings=#ROOTCONFIGPATH#DnsMeter\DnsSettings.inc
; Wider than the gadgets, like the other ModernGadgets settings windows
bgWidth=230
dnsSettingsPath=#ROOTCONFIGPATH#DnsMeter\DnsSettings.inc
dnsMeterConfig=#ROOTCONFIG#\DnsMeter

; ==================================================
;  MEASURES

; Lists this PC's network adapters. Output: Name|Description|Status;...
[MeasureAdapters]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "(Get-NetAdapter | Sort-Object Name | ForEach-Object { '{0}|{1}|{2}' -f ($_.Name -replace '[|;]','_'), ($_.InterfaceDescription -replace '[|;]','_'), $_.Status }) -join ';'"
OutputType=ANSI
State=Hide
Timeout=15000
FinishAction=[!CommandMeasure MeasureScript "SetAdapters()"]

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#DnsMeterSettings.lua

; ==================================================
;  METERS

[MeterBackground]
Meter=Shape
MeterStyle=StyleBackground

[MeterTitle]
Meter=String
MeterStyle=StyleString | StyleStringSettingsSkinTitle
StringCase=None
Text=DNS Meter Settings

[MeterCloseButton]
Meter=Shape
MeterStyle=StyleCloseWindowButton

[MeterSectionInterfaces]
Meter=String
MeterStyle=StyleString | StyleStringSettingsSectionLabel
Y=8R
Text=Interfaces to display

; ------------------------------ Interface #1

[MeterSlot1Label]
Meter=String
MeterStyle=StyleString
FontColor=#colorAccent#
X=(#contentMargin# + 1)
Y=4R
Text=Interface #1:

[MeterSlot1Box]
Meter=Shape
MeterStyle=StyleInputBoxBackground
LeftMouseUpAction=[!CommandMeasure MeasureScript "Step(1, 1)"]
RightMouseUpAction=[!CommandMeasure MeasureScript "Step(1, -1)"]
MouseOverAction=[!SetOption #CURRENTSECTION# Fill "Fill Color #colorBorder#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Fill ""][!UpdateMeter #CURRENTSECTION#][!Redraw]
ToolTipText=Click: next adapter#CRLF#Right-click: previous adapter

[MeterSlot1Value]
Meter=String
MeterStyle=StyleString
X=4r
Y=2r
W=(#contentWidth# - 26)
ClipString=1
Text=(none)
DynamicVariables=1
Group=Slots

[MeterSlot1Clear]
Meter=String
MeterStyle=StyleString
StringAlign=Right
FontColor=#colorDim#
FontWeight=600
X=(#contentMarginRight# - 4)
Y=r
Text=x
LeftMouseUpAction=[!CommandMeasure MeasureScript "Clear(1)"]
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#colorError#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#colorDim#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
ToolTipText=Clear this slot

[MeterSlot1Sub]
Meter=String
MeterStyle=StyleString
FontSize=7
FontColor=#colorDim#
X=(#contentMargin# + 1)
Y=4R
W=#contentWidth#
ClipString=1
Text=" "
DynamicVariables=1
Group=Slots

