; ==================================================
;  DNS Meter - a ModernGadgets-style add-on gadget
;  Shows the IPv4 DNS server(s) configured on your network interfaces.
;
;  INSTALL: copy the whole DnsMeter folder (DnsMeter.ini, DnsMeter.lua,
;  DnsSettings.inc and the Settings subfolder) to
;    Documents\Rainmeter\Skins\ModernGadgets\DnsMeter\
;  then Refresh All in Rainmeter and load ModernGadgets\DnsMeter.
;  It uses ModernGadgets' own @Resources, so it follows your global
;  ModernGadgets colours, fonts, scale and background-border settings.
;
;  CHOOSING WHAT IT SHOWS
;  Right-click > DNS Meter settings (or click the gadget) to pick up to four
;  interfaces, like Network Meter's interface slots. They are saved in
;  DnsSettings.inc. With no interfaces picked, it shows the active interface.
;
;  HOW IT UPDATES
;  - PowerShell lists the network adapters and their status (on load, on
;    adapter/IP change, and every #ifRecheckSeconds# as a fallback).
;  - Each interface's DNS is read from the registry every second, so manual
;    DNS changes appear almost immediately:
;      HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces\{GUID}
;        NameServer     = manually set DNS
;        DhcpNameServer = DNS handed out by DHCP
; ==================================================

[Rainmeter]
MiddleMouseDownAction=[!Refresh]
MouseOverAction=[!ShowMeterGroup ConfigButton][!UpdateMeterGroup ConfigButton][!UpdateMeterGroup Background][!Redraw]
MouseLeaveAction=[!HideMeterGroup ConfigButton][!UpdateMeterGroup ConfigButton][!UpdateMeterGroup Background][!Redraw]
Group=ModernGadgets | MgGlobalRefresh | MgImportRefresh | MgDnsMeter
AccurateText=1

; Custom Context Menu
ContextTitle=DNS Meter settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\DnsMeter\Settings" "DnsMeterSettings.ini"]
ContextTitle2=Re-detect interfaces
ContextAction2=[!CommandMeasure MeasureIfList "Run"]
ContextTitle3=Global settings
ContextAction3=[!ActivateConfig "ModernGadgets\Settings\GlobalSettings" "GlobalSettings.ini"]
ContextTitle4=Gadget manager
ContextAction4=[!ActivateConfig "ModernGadgets\Settings\GadgetManager" "GadgetManager.ini"]

[Metadata]
Name=DNS Meter
Author=Darin (built on raiguard's ModernGadgets)
Information=Displays the DNS servers defined on your network adapters, styled to match ModernGadgets. Choose up to four interfaces to show in DNS Meter Settings.
License=MIT (see LICENSE.md)
Version=1.3.0

; ========= Variables and Styles =========

[Variables]
@includeStyleSheet=#@#StyleSheet.inc
@includeGlobalSettings=#@#Settings\GlobalSettings.inc
@includeDynamicVars=#dynamicVarsPath#
@includeDnsSettings=#CURRENTPATH#DnsSettings.inc

; Fallback interval (seconds) for re-detecting interfaces
ifRecheckSeconds=60

regBase=SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces
slotGuid1=
slotGuid2=
slotGuid3=
slotGuid4=

; ==================================================
;  MEASURES

[MeasureSettingsScript]
Measure=Script
ScriptFile=#scriptPath#Settings.lua
SettingsPath=#globalSettingsPath#

; ------------------------------
; INTERFACE LIST
; Output: Name|Description|{GUID}|Status|isActive;...  (all adapters, sorted by name)

[MeasureIfList]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$r = @(Get-NetRoute -DestinationPrefix 0.0.0.0/0 -ErrorAction SilentlyContinue); $act = ($r | Sort-Object { $_.RouteMetric + (Get-NetIPInterface -InterfaceIndex $_.ifIndex -AddressFamily IPv4).InterfaceMetric } | Select-Object -First 1).ifIndex; (Get-NetAdapter -IncludeHidden | Sort-Object Name | ForEach-Object { '{0}|{1}|{2}|{3}|{4}' -f ($_.Name -replace '[|;]','_'), ($_.InterfaceDescription -replace '[|;]','_'), $_.InterfaceGuid, $_.Status, $(if ($_.ifIndex -eq $act) { 1 } else { 0 }) }) -join ';'"
OutputType=ANSI
State=Hide
Timeout=15000
FinishAction=[!CommandMeasure MeasureDnsScript "SetAdapters()"]

; ------------------------------
; DNS SERVERS (registry, one pair per interface slot, polled every second)

[MeasureRegStatic1]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid1#
RegValue=NameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegDhcp1]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid1#
RegValue=DhcpNameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegStatic2]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid2#
RegValue=NameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegDhcp2]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid2#
RegValue=DhcpNameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegStatic3]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid3#
RegValue=NameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegDhcp3]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid3#
RegValue=DhcpNameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegStatic4]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid4#
RegValue=NameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

[MeasureRegDhcp4]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=#regBase#\#slotGuid4#
RegValue=DhcpNameServer
DynamicVariables=1
Group=DnsReg
Disabled=1

; Display logic (must come after the registry measures)
[MeasureDnsScript]
Measure=Script
ScriptFile=#CURRENTPATH#DnsMeter.lua

; ------------------------------
; TRIGGERS: re-detect interfaces on network change + periodic fallback

[MeasureIfTimer]
Measure=Calc
Formula=(MeasureIfTimer % #ifRecheckSeconds#) + 1
IfCondition=MeasureIfTimer = 1
IfTrueAction=[!CommandMeasure MeasureIfList "Run"]

[MeasureBestAdapter]
Measure=Plugin
Plugin=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
SysInfoData=Best
OnChangeAction=[!CommandMeasure MeasureIfList "Run"]

[MeasureBestIp]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
OnChangeAction=[!CommandMeasure MeasureIfList "Run"]

; ==================================================
;  METERS

[MeterBackground]
Meter=Shape
MeterStyle=StyleBackground

; ------------------------------
; GADGET HEADER

[MeterConfigButton_]
Meter=Shape
MeterStyle=StyleConfigButtonNew

[MeterDnsRefreshButton_]
Meter=Shape
MeterStyle=StyleRefreshButton
X=-18r
Y=r
Group=ConfigButton
Hidden=1

[MeterDnsIcon]
Meter=Shape
X=#contentMargin#
Y=(#contentMargin# + 1)
; Globe icon in the accent colour, like the other gadgets' header icons
Shape=Ellipse 7,7,6,6 | Fill Color 0,0,0,0 | StrokeWidth 1.5 | Stroke Color #colorAccent#
Shape2=Ellipse 7,7,2.6,6 | Fill Color 0,0,0,0 | StrokeWidth 1.2 | Stroke Color #colorAccent#
Shape3=Line 1,7,13,7 | StrokeWidth 1.2 | Stroke Color #colorAccent#
Shape4=Line 2,3.8,12,3.8 | StrokeWidth 1 | Stroke Color #colorAccent#
Shape5=Line 2,10.2,12,10.2 | StrokeWidth 1 | Stroke Color #colorAccent#
Padding=0,0,1,1
TransformationMatrix=#transformationMatrix#
DynamicVariables=1

[MeterGadgetTitle]
Meter=String
MeterStyle=StyleString | StyleStringGadgetLabel
X=4R
Text=DNS Meter

; ------------------------------
; BODY: two columns built by DnsMeter.lua
; Interface names are shown in the accent colour, "None" is dimmed.

[MeterDnsLabels]
Meter=String
MeterStyle=StyleString
X=#contentMargin#
Y=(#rowSpacing# + 2)R
Text=Detecting...
InlineSetting=Color | #colorAccent#
InlinePattern=(?m)^(?!Primary:|Secondary:)(.+)$
InlineSetting2=Color | #colorDim#
InlinePattern2=\((?:active|disconnected|not found)\)
SolidColor=0,0,0,1
DynamicVariables=1
Group=DnsBody
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\DnsMeter\Settings" "DnsMeterSettings.ini"]
ToolTipText=Click to choose which interfaces to show

[MeterDnsValues]
Meter=String
MeterStyle=StyleString | StyleStringRightAlign
Text=" "
InlineSetting=Color | #colorDim#
InlinePattern=(?m)^None$
SolidColor=0,0,0,1
DynamicVariables=1
Group=DnsBody
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\DnsMeter\Settings" "DnsMeterSettings.ini"]
ToolTipText=Click to choose which interfaces to show

[MeterBackgroundHeight]
Meter=Image
MeterStyle=StyleBackgroundHeight

; ------------------------------
; MOUSE REGIONS

[MeterTitleRegion]
Meter=Image
SolidColor=0,0,0,1
X=([MeterDnsIcon:X] * #scale#)
Y=([MeterDnsIcon:Y] * #scale#)
W=(([MeterGadgetTitle:XW] - [MeterDnsIcon:X]) * #scale#)
H=([MeterGadgetTitle:H] * #scale#)
DynamicVariables=1
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\DnsMeter\Settings" "DnsMeterSettings.ini"]
ToolTipText=Click to choose which interfaces to show

[MeterDnsRefreshButton]
Meter=Image
MeterStyle=StyleMouseRegion | StyleMouseRegionShapeRefreshButton
LeftMouseUpAction=[!CommandMeasure MeasureIfList "Run"][!SetOption #CURRENTSECTION#_ Fill "Fill Color #colorAccent#"][!UpdateMeter #CURRENTSECTION#_][!Redraw]
ToolTipText=Re-detect interfaces
Group=ConfigButton
Hidden=1

[MeterConfigButton]
Meter=Image
MeterStyle=StyleMouseRegion | StyleMouseRegionShapeButtonHover
LeftMouseUpAction=[!SkinCustomMenu]
Group=ConfigButton
Hidden=1
